[project]
name = "wikifin-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bastien Winant", email = "armand.winant@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pinecone>=10.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "supabase>=2.32.0",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
]

[project.scripts]
wikifin-rag = "wikifin_rag:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
crawler = [
    "beautifulsoup4>=4.15.0",
    "scrapy>=2.19.0",
    "trafilatura>=2.3.1",
]
dev = [
    "faker>=40.43.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]
